# nginx: WebSocket-aware load balancer for the GoChat cluster.
events {}

http {
    upstream gochat_backend {
        # Docker Compose service discovery: gochat-1..3
        server gochat-1:8080;
        server gochat-2:8080;
        server gochat-3:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /ws {
            proxy_pass http://gochat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;   # long-lived WebSocket sessions
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://gochat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
