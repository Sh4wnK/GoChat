# GoChat distributed deployment: 3 gochat replicas, PostgreSQL, Redis,
# and an nginx load balancer terminating WebSocket upgrades.
#
#   docker compose up --build -d
#   open http://localhost:8080        (browser client)
#
# The replicas share one JWT secret (set GOCHAT_JWT_SECRET), one
# PostgreSQL database and one Redis pub/sub bus, so they behave as a
# single logical chat server.

name: gochat

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gochat
      POSTGRES_PASSWORD: gochat
      POSTGRES_DB: gochat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gochat -d gochat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gochat:
    build: .
    image: gochat:latest
    deploy:
      replicas: 3
    environment:
      GOCHAT_ADDR: ":8080"
      # Set a real secret in production: openssl rand -hex 32
      GOCHAT_JWT_SECRET: ${GOCHAT_JWT_SECRET:-dev-only-change-me-please-32bytes!!}
      GOCHAT_DATABASE_URL: postgres://gochat:gochat@postgres:5432/gochat?sslmode=disable
      GOCHAT_REDIS_ADDR: redis:6379
      GOCHAT_ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/users >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gochat
    restart: unless-stopped

volumes:
  pgdata:
